# Local demo: docker compose -f deploy/compose.yml up --build
services:
  lsm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lsm:latest
    ports:
      - "8080:8080"
    volumes:
      - lsm-data:/data
      - lsm-backup:/backup
    restart: unless-stopped

volumes:
  lsm-data:
  lsm-backup:
